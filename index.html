<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>متجر أحمر — كتب إلكترونية تقرؤها في تطبيق أحمر</title>
  <meta name="description" content="اشترِ كتبك الإلكترونية من متجر أحمر بالبطاقة الذهبية أو CIB، وتجدها فوراً في مكتبتك على تطبيق أحمر.">
  <meta name="theme-color" content="#fbf6ec">
  <meta property="og:title" content="متجر أحمر">
  <meta property="og:description" content="كتب إلكترونية تشتريها هنا وتقرؤها في تطبيق أحمر.">
  <meta property="og:image" content="https://store.ah-mar.app/assets/logo-192.png">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://backend.ah-mar.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/style.css?v=20261002b">
</head>
<body>
  <header id="top"></header>
  <main>
    <section class="hero wrap">
      <h1><span data-i18n="heroA"></span><br><em data-i18n="heroB"></em></h1>
      <p data-i18n="heroP"></p>
      <div class="steps">
        <div class="step"><b>1</b><span data-i18n="step1"></span></div>
        <div class="step"><b>2</b><span data-i18n="step2"></span></div>
        <div class="step"><b>3</b><span data-i18n="step3"></span></div>
      </div>
      <div class="ios-note" id="ios-note">
        <span id="apple-icon"></span>
        <div><b data-i18n="iosTitle"></b><p data-i18n="iosBody"></p></div>
      </div>
    </section>

    <section class="wrap">
      <div class="toolbar">
        <label class="search">
          <span id="search-icon"></span>
          <input id="q" type="search" data-i18n-ph="search" autocomplete="off" aria-label="Search">
        </label>
        <div class="chips" id="cats" role="toolbar"></div>
      </div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>
  </main>
  <footer id="foot"></footer>

  <script type="module">
    import { mountLayout, getCatalog, getUser, getOwnedIds, coverUrl, bookUrl, formatPrice, esc, ICON, t } from "/assets/app.js?v=20261002b";

    mountLayout();
    document.title = t("metaTitle");
    document.getElementById("search-icon").innerHTML = ICON.search;
    document.getElementById("apple-icon").innerHTML = ICON.apple;
    document.getElementById("cats").setAttribute("aria-label", t("categories"));

    const grid = document.getElementById("grid");
    const cats = document.getElementById("cats");
    const input = document.getElementById("q");
    grid.innerHTML = Array.from({ length: 10 }, () =>
      `<div class="card skeleton"><div class="cover"></div><div class="line" style="width:80%"></div><div class="line" style="width:45%"></div></div>`).join("");

    let books = [], owned = new Set(), activeCat = "";
    const norm = (s) => (s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");

    function render() {
      const term = norm(input.value.trim());
      const list = books.filter((b) =>
        (!activeCat || b.category?.$id === activeCat) &&
        (!term || norm(b.title).includes(term) || norm(b.author).includes(term)));
      if (!list.length) {
        grid.innerHTML = `<div class="empty">${t("noMatch")}</div>`;
        return;
      }
      grid.innerHTML = list.map((b, i) => `
        <a class="card" href="${bookUrl(b.id)}">
          <div class="cover">
            ${b.cover ? `<img src="${coverUrl(b.cover, 360)}" alt="${esc(b.title)}" ${i < 6 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" width="360" height="540">` : ""}
            ${owned.has(b.id) ? `<span class="badge">${t("inLibrary")}</span>` : ""}
          </div>
          <h3>${esc(b.title)}</h3>
          ${b.author ? `<div class="author">${esc(b.author)}</div>` : ""}
          <div class="price ${b.price ? "" : "free"}">${formatPrice(b.price)}</div>
        </a>`).join("");
    }

    getCatalog().then((cat) => {
      books = cat.books;
      const used = new Set(books.map((b) => b.category?.$id).filter(Boolean));
      const list = cat.categories.filter((c) => used.has(c.$id));
      cats.innerHTML = `<button class="chip" aria-pressed="true" data-id="">${t("all")}</button>` +
        list.map((c) => `<button class="chip" aria-pressed="false" data-id="${esc(c.$id)}">${esc(c.name)}</button>`).join("");
      render();
    }).catch(() => {
      grid.innerHTML = `<div class="empty">${t("loadFail")}</div>`;
    });

    getUser().then(getOwnedIds).then((ids) => { owned = ids; if (books.length) render(); });

    cats.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      activeCat = btn.dataset.id;
      cats.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === btn)));
      render();
    });
    input.addEventListener("input", render);
  </script>
</body>
</html>
