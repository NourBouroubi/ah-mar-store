<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لم يكتمل الدفع — متجر أحمر</title>
  <meta name="theme-color" content="#fbf6ec">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://backend.ah-mar.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

</head>
<body>
  <header id="top"></header>
  <main class="wrap" id="main"><div class="panel"><div class="spinner" style="margin:24px auto"></div></div></main>
  <footer id="foot"></footer>

  <script type="module">
    import { mountLayout, bookUrl, ICON, t } from "/assets/app.js?v=20261003b";

    mountLayout();
    document.title = t("failTitle");
    const first = (new URLSearchParams(location.search).get("books") || "").split(",")[0];
    document.getElementById("main").innerHTML = `<div class="panel">
      <div class="state-icon bad">${ICON.x}</div>
      <h1>${t("failTitle")}</h1>
      <p>${t("failP")}</p>
      <div class="stack">
        ${first ? `<a class="btn btn-primary btn-block" href="${bookUrl(first)}">${t("tryAgain")}</a>` : ""}
        <a class="btn btn-ghost btn-block" href="/">${t("backToStore")}</a>
      </div>
    </div>`;
  </script>
</body>
</html>
