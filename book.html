<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>متجر أحمر</title>
  <meta name="theme-color" content="#fbf6ec">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://backend.ah-mar.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="top"></header>
  <main class="wrap" id="main">
    <div class="book skeleton" aria-busy="true">
      <div class="cover"></div>
      <div class="stack"><div class="line" style="width:60%;height:28px"></div><div class="line" style="width:30%"></div></div>
    </div>
  </main>
  <footer id="foot"></footer>

  <script type="module">
    import { mountLayout, getCatalog, getUser, getOwnedIds, startCheckout, coverUrl, formatPrice, openInAppUrl, esc, toast, ICON } from "/assets/app.js";

    mountLayout();
    const main = document.getElementById("main");
    const id = new URLSearchParams(location.search).get("id") || "";

    const [catalog, user] = await Promise.all([getCatalog().catch(() => null), getUser()]);
    const book = catalog?.books.find((b) => b.id === id);

    if (!book) {
      main.innerHTML = `<div class="panel">
        <div class="state-icon bad">${ICON.x}</div>
        <h1>الكتاب غير موجود</h1>
        <p>ربما أُزيل من المتجر أو أن الرابط غير صحيح.</p>
        <a class="btn btn-primary" href="/">تصفّح الكتب</a></div>`;
    } else {
      document.title = `${book.title} — متجر أحمر`;
      const owned = (await getOwnedIds(user)).has(book.id);
      render(owned);
    }

    function render(owned) {
      const meta = [
        book.category?.name,
        book.pages ? `${book.pages} صفحة` : "",
        "كتاب إلكتروني",
      ].filter(Boolean);

      main.innerHTML = `<div class="book">
        <div class="cover">${book.cover ? `<img src="${coverUrl(book.cover, 600)}" alt="${esc(book.title)}" fetchpriority="high" width="600" height="900">` : ""}</div>
        <div>
          <div class="crumbs"><a href="/">المتجر</a>${book.category ? ` / ${esc(book.category.name)}` : ""}</div>
          <h1>${esc(book.title)}</h1>
          ${book.author ? `<div class="by">${esc(book.author)}</div>` : ""}
          <div class="meta">${meta.map((m) => `<span>${esc(m)}</span>`).join("")}</div>
          <div class="buy-box" id="buy"></div>
          ${book.description ? `<div class="desc"><h2>عن الكتاب</h2>${esc(book.description)}</div>` : ""}
        </div>
      </div>`;
      renderBuy(owned);
    }

    function renderBuy(owned) {
      const box = document.getElementById("buy");
      const next = encodeURIComponent(location.pathname + location.search);

      if (owned) {
        box.innerHTML = `
          <div class="owned">${ICON.check}<span>هذا الكتاب في مكتبتك</span></div>
          <a class="btn btn-green btn-block" href="${openInAppUrl(book.id)}">${ICON.phone}اقرأه في تطبيق أحمر</a>
          <p class="note" style="margin:10px 0 0">القراءة متاحة في التطبيق فقط، بالحساب نفسه.</p>`;
        return;
      }

      const free = book.price <= 0;
      const priceHtml = `<div class="amount">${free ? "مجاني" : `${formatPrice(book.price).replace(" دج", "")} <small>دج</small>`}</div>
        <div class="note">${free ? "يُضاف إلى مكتبتك مجاناً ويبقى فيها." : "دفعة واحدة، والكتاب لك إلى الأبد."} يُقرأ في تطبيق أحمر.</div>`;

      if (!user) {
        box.innerHTML = `${priceHtml}
          <a class="btn btn-primary btn-block" href="/account.html?next=${next}">${free ? "سجّل الدخول لإضافته إلى مكتبتك" : "سجّل الدخول للشراء"}</a>
          <p class="note" style="margin:10px 0 0">استعمل الحساب نفسه الذي في التطبيق، ليصل الكتاب إلى مكتبتك.</p>`;
        return;
      }

      if (free) {
        box.innerHTML = `${priceHtml}<button class="btn btn-green btn-block" id="go">أضفه إلى مكتبتي</button>`;
      } else {
        box.innerHTML = `${priceHtml}
          <div class="methods" role="radiogroup" aria-label="طريقة الدفع">
            <button class="method" role="radio" aria-checked="true" data-m="edahabia"><span class="dot"></span><span><b>الذهبية</b><small>بريد الجزائر</small></span></button>
            <button class="method" role="radio" aria-checked="false" data-m="cib"><span class="dot"></span><span><b>CIB</b><small>البطاقة البنكية</small></span></button>
          </div>
          <button class="btn btn-primary btn-block" id="go">ادفع ${formatPrice(book.price)}</button>
          <div class="trust"><span>${ICON.lock}دفع آمن عبر Chargily</span><span>${ICON.bolt}يصل الكتاب فوراً</span></div>`;
        box.querySelector(".methods").addEventListener("click", (e) => {
          const m = e.target.closest(".method");
          if (!m) return;
          box.querySelectorAll(".method").forEach((x) => x.setAttribute("aria-checked", String(x === m)));
        });
      }

      const go = document.getElementById("go");
      go.addEventListener("click", async () => {
        const method = box.querySelector('.method[aria-checked="true"]')?.dataset.m || "edahabia";
        const label = go.innerHTML;
        go.disabled = true;
        go.innerHTML = `<span class="spinner" style="width:20px;height:20px;border-width:2px"></span>`;
        try {
          const res = await startCheckout([book.id], method);
          if (res.checkout_url) {
            location.href = res.checkout_url;
            return;
          }
          location.href = `/success.html?books=${encodeURIComponent(book.id)}&free=1`;
        } catch (e) {
          go.disabled = false;
          go.innerHTML = label;
          if (e.type === "already_owned") { renderBuy(true); return; }
          if (e.code === 401) { location.href = `/account.html?next=${next}`; return; }
          toast("تعذّر بدء الدفع. حاول مرة أخرى بعد قليل.");
        }
      });
    }
  </script>
</body>
</html>
