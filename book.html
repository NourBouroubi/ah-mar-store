<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>متجر أحمر</title>
  <meta name="theme-color" content="#fbf6ec">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://backend.ah-mar.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="top"></header>
  <main class="wrap" id="main">
    <div class="book skeleton" aria-busy="true">
      <div class="cover"></div>
      <div class="stack"><div class="line" style="width:60%;height:28px"></div><div class="line" style="width:30%"></div></div>
    </div>
  </main>
  <footer id="foot"></footer>

  <script type="module">
    import { mountLayout, getCatalog, getUser, getOwnedIds, startCheckout, coverUrl, formatPrice, currency, openInAppUrl, esc, toast, ICON, t } from "/assets/app.js";

    mountLayout();
    const main = document.getElementById("main");
    const id = new URLSearchParams(location.search).get("id") || "";

    const [catalog, user] = await Promise.all([getCatalog().catch(() => null), getUser()]);
    const book = catalog?.books.find((b) => b.id === id);

    if (!book) {
      main.innerHTML = `<div class="panel">
        <div class="state-icon bad">${ICON.x}</div>
        <h1>${t("notFound")}</h1>
        <p>${t("notFoundP")}</p>
        <a class="btn btn-primary" href="/">${t("browse")}</a></div>`;
    } else {
      document.title = `${book.title} — ${t("metaTitle").split(" — ")[0]}`;
      const owned = (await getOwnedIds(user)).has(book.id);
      render(owned);
    }

    function render(owned) {
      const meta = [
        book.category?.name,
        book.pages ? `${book.pages} ${t("pages")}` : "",
        t("ebook"),
      ].filter(Boolean);

      main.innerHTML = `<div class="book">
        <div class="cover">${book.cover ? `<img src="${coverUrl(book.cover, 600)}" alt="${esc(book.title)}" fetchpriority="high" width="600" height="900">` : ""}</div>
        <div>
          <div class="crumbs"><a href="/">${t("store")}</a>${book.category ? ` / ${esc(book.category.name)}` : ""}</div>
          <h1 dir="auto">${esc(book.title)}</h1>
          ${book.author ? `<div class="by">${esc(book.author)}</div>` : ""}
          <div class="meta">${meta.map((m) => `<span>${esc(m)}</span>`).join("")}</div>
          <div class="buy-box" id="buy"></div>
          ${book.description ? `<div class="desc"><h2>${t("about")}</h2><div dir="auto">${esc(book.description)}</div></div>` : ""}
        </div>
      </div>`;
      renderBuy(owned);
    }

    function renderBuy(owned) {
      const box = document.getElementById("buy");
      const next = encodeURIComponent(location.pathname + location.search);

      if (owned) {
        box.innerHTML = `
          <div class="owned">${ICON.check}<span>${t("owned")}</span></div>
          <a class="btn btn-green btn-block" href="${openInAppUrl(book.id)}">${ICON.phone}${t("readInApp")}</a>
          <p class="note" style="margin:10px 0 0">${t("readOnlyApp")}</p>`;
        return;
      }

      const free = book.price <= 0;
      const priceHtml = `<div class="amount">${free ? t("free") : `${formatPrice(book.price).replace(" " + currency, "")} <small>${currency}</small>`}</div>
        <div class="note">${free ? t("noteFree") : t("notePaid")}</div>`;
      const iosMini = `<div class="ios-mini">${ICON.apple}<span>${t("iosShort")}</span></div>`;

      if (!user) {
        box.innerHTML = `${priceHtml}
          <a class="btn btn-primary btn-block" href="/account.html?next=${next}">${free ? t("signInToAdd") : t("signInToBuy")}</a>
          <p class="note" style="margin:10px 0 0">${t("sameAccount")}</p>${free ? "" : iosMini}`;
        return;
      }

      if (free) {
        box.innerHTML = `${priceHtml}<button class="btn btn-green btn-block" id="go">${t("addToLibrary")}</button>`;
      } else {
        box.innerHTML = `${priceHtml}
          <div class="methods" role="radiogroup" aria-label="${esc(t("payMethod"))}">
            <button class="method" role="radio" aria-checked="true" data-m="edahabia"><span class="dot"></span><span><b>${t("edahabia")}</b><small>${t("edahabiaSub")}</small></span></button>
            <button class="method" role="radio" aria-checked="false" data-m="cib"><span class="dot"></span><span><b>CIB</b><small>${t("cibSub")}</small></span></button>
          </div>
          <button class="btn btn-primary btn-block" id="go">${t("pay")} ${formatPrice(book.price)}</button>
          <div class="trust"><span>${ICON.lock}${t("securePay")}</span><span>${ICON.bolt}${t("instant")}</span></div>${iosMini}`;
        box.querySelector(".methods").addEventListener("click", (e) => {
          const m = e.target.closest(".method");
          if (!m) return;
          box.querySelectorAll(".method").forEach((x) => x.setAttribute("aria-checked", String(x === m)));
        });
      }

      const go = document.getElementById("go");
      go.addEventListener("click", async () => {
        const method = box.querySelector('.method[aria-checked="true"]')?.dataset.m || "edahabia";
        const label = go.innerHTML;
        go.disabled = true;
        go.innerHTML = `<span class="spinner" style="width:20px;height:20px;border-width:2px"></span>`;
        try {
          const res = await startCheckout([book.id], method);
          if (res.checkout_url) {
            location.href = res.checkout_url;
            return;
          }
          location.href = `/success.html?books=${encodeURIComponent(book.id)}&free=1`;
        } catch (e) {
          go.disabled = false;
          go.innerHTML = label;
          if (e.type === "already_owned") { renderBuy(true); return; }
          if (e.code === 401) { location.href = `/account.html?next=${next}`; return; }
          toast(t("payFail"));
        }
      });
    }
  </script>
</body>
</html>
