<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تمّ الشراء — متجر أحمر</title>
  <meta name="theme-color" content="#fbf6ec">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://backend.ah-mar.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/style.css?v=20261002b">
</head>
<body>
  <header id="top"></header>
  <main class="wrap" id="main"><div class="panel"><div class="spinner" style="margin:24px auto"></div></div></main>
  <footer id="foot"></footer>

  <script type="module">
    import { mountLayout, getUser, getCatalog, getOwnedIds, openInAppUrl, bookUrl, coverUrl, esc, ICON, t } from "/assets/app.js?v=20261002b";

    mountLayout();
    document.title = t("bought");
    const main = document.getElementById("main");
    const params = new URLSearchParams(location.search);
    const ids = (params.get("books") || "").split(",").filter(Boolean);
    const first = ids[0] || "";

    const user = await getUser();
    const catalog = await getCatalog().catch(() => ({ books: [] }));
    const titles = catalog.books.filter((b) => ids.includes(b.id));
    const cover = titles[0]?.cover;

    function show(state) {
      const done = state === "done";
      main.innerHTML = `<div class="panel">
        ${cover ? `<img src="${coverUrl(cover, 240)}" alt="" width="120" height="180" style="width:120px;border-radius:8px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(0,0,0,.15)">` : ""}
        <div class="state-icon ${done ? "ok" : "wait"}">${done ? ICON.check : `<div class="spinner"></div>`}</div>
        <h1>${done ? t("doneTitle") : state === "slow" ? t("slowTitle") : t("waitTitle")}</h1>
        ${done && titles.length ? `<p dir="auto" style="margin-bottom:6px"><b>${esc(titles.map((b) => b.title).join(" · "))}</b></p>` : ""}
        <p>${done ? t("doneP") : state === "slow" ? t("slowP") : t("waitP")}</p>
        <div class="stack">
          <a class="btn btn-green btn-block" href="${openInAppUrl(first)}">${ICON.phone}${t("backToApp")}</a>
          <a class="btn btn-ghost btn-block" href="/account.html">${t("myLibrary")}</a>
        </div>
      </div>`;
    }

    if (!user || !ids.length) {
      show(user ? "done" : "slow");
    } else {
      show("wait");
      // The webhook usually lands within seconds of the redirect.
      const started = Date.now();
      let state = "wait";
      while (Date.now() - started < 45000) {
        const owned = await getOwnedIds(user);
        if (ids.every((id) => owned.has(id))) { state = "done"; break; }
        await new Promise((r) => setTimeout(r, 2500));
      }
      show(state === "done" ? "done" : "slow");
    }
  </script>
</body>
</html>
